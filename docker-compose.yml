version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culcloud-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - redis
      - minio
      - gotenberg
    networks:
      - culcloud_net
    volumes:
      - ./backend:/app

  redis:
    image: redis:7-alpine
    container_name: culcloud-redis
    ports:
      - "6379:6379"
    networks:
      - culcloud_net
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: culcloud-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    command: server /data --console-address ":9001"
    networks:
      - culcloud_net
    volumes:
      - minio_data:/data


  gotenberg:
    image: gotenberg/gotenberg:7
    container_name: culcloud-gotenberg
    networks:
      - culcloud_net
    command:
      - "gotenberg"

networks:
  culcloud_net:
    driver: bridge

volumes:
  redis_data:
  minio_data:
