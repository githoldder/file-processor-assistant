name: culcloud-demo

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - demo_net
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: file_processor
      POSTGRES_USER: fileuser
      POSTGRES_PASSWORD: filepass123
    networks:
      - demo_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - full

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    ports:
      - "9010:9000"
      - "9011:9001"
    networks:
      - demo_net
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:7
    command: ["gotenberg"]
    networks:
      - demo_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: culcloud-demo-api:local
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      GOTENBERG_URL: http://gotenberg:3000
    depends_on:
      - redis
      - minio
      - gotenberg
    networks:
      - demo_net
    volumes:
      - ./backend:/app

  hadoop:
    image: ${HADOOP_IMAGE:-myubuntu:hadoop-mapreduce-lab-topn}
    command: ["bash", "-lc", "service ssh start || true; /usr/local/hadoop/sbin/start-yarn.sh || true; tail -f /dev/null"]
    environment:
      HADOOP_HOME: /usr/local/hadoop
    ports:
      - "8088:8088"
      - "9870:9870"
    networks:
      - demo_net
    volumes:
      - hadoop_data:/hadoop/data
      - hadoop_logs:/usr/local/hadoop/logs
    profiles:
      - hadoop

  spark-analytics:
    image: python:3.8-slim
    working_dir: /app
    command: ["bash", "-c", "pip install -q pyspark && python scripts/spark/file_stats.py --input /app/data/raw/objects.csv --output /app/data/spark-output && echo 'Spark done. Sleeping...' && tail -f /dev/null"]
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
    networks:
      - demo_net
    volumes:
      - ./scripts/spark:/app/scripts/spark
      - ./data:/app/data
    profiles:
      - analytics
    depends_on:
      - redis
      - minio

  flask-analytics:
    build:
      context: ./flask-analytics
      dockerfile: Dockerfile
    image: culcloud-flask-analytics:local
    ports:
      - "5000:5000"
    environment:
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_BUCKET: documents
      SPARK_OUTPUT_DIR: /app/data/spark-output
    networks:
      - demo_net
    volumes:
      - ./flask-analytics:/app
      - ./data:/app/data
    profiles:
      - analytics
    depends_on:
      - redis
      - minio

networks:
  demo_net:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  minio_data:
  hadoop_data:
  hadoop_logs:
